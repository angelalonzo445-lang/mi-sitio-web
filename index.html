<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Angel Sotojo</title>
    <!-- Cargar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargar fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7); /* Fondo semi-transparente */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .text-accent { color: #e5dbc3; }
        
        /* Efecto de luz detrás del logo */
        .glow-avatar {
            position: relative;
        }
        .glow-avatar::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #e5dbc3, #374151);
            border-radius: 50%;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .glow-avatar:hover::before {
            opacity: 1;
        }
    </style>
</head>
