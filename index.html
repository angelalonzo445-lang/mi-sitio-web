<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Angel Sotojo</title>
    <!-- Cargar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargar fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7); /* Fondo semi-transparente */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .text-accent { color: #e5dbc3; }
        
        /* Efecto de luz detrás del logo */
        .glow-avatar {
            position: relative;
        }
        .glow-avatar::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #e5dbc3, #374151);
            border-radius: 50%;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .glow-avatar:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 text-gray-100 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-gray-800 via-gray-950 to-black">

    <main class="glass-card w-full max-w-[380px] rounded-[2.5rem] p-8 border border-gray-800 relative overflow-hidden fade-in-up">
        
        <!-- Botón de compartir -->
        <div class="absolute top-6 right-6 z-10">
            <button onclick="shareCard()" class="w-10 h-10 bg-gray-800/80 hover:bg-gray-700 border border-gray-700 rounded-full flex items-center justify-center text-gray-300 hover:text-white transition-all backdrop-blur-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
        </div>

        <div class="flex flex-col items-center mt-4 mb-8 fade-in-up delay-100">
            
            <!-- Logo de La Garra Prints -->
            <div class="w-32 h-32 mb-5 glow-avatar rounded-full cursor-pointer relative" onclick="this.querySelector('img').classList.toggle('scale-110');">
                <div class="w-full h-full bg-black rounded-full flex items-center justify-center overflow-hidden border-2 border-gray-800">
                    <!-- Logo de la garra incrustado en el archivo -->
                    <img src="data:image/png;base64,...IMAGEN_EN_BASE64..." alt="Logo La Garra Prints" class="w-full h-full object-contain p-2 transition-transform duration-500 ease-out">
                </div>
            </div>
            
            <!-- Textos originales -->
            <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-1">Angel Sotojo</h1>
            <p class="text-sm text-accent font-medium text-center uppercase tracking-wider">Gerente General</p>
            <p class="text-xs text-gray-400 mt-1 text-center">La Garra Prints | Serigrafía y 3D</p>
        </div>

        <div class="space-y-4 mb-6 fade-in-up delay-200">
            
            <!-- Botón Portafolio Canva -->
            <a href="https://lagarraprints.my.canva.site/" target="_blank" rel="noopener noreferrer" class="w-full flex items-center p-4 bg-gray-800/60 hover:bg-gray-700/80 border border-gray-700 hover:border-gray-500 rounded-2xl transition-all group">
                <div class="w-12 h-12 bg-gray-900 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform text-accent">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-bold text-white">Portafolio Web</p>
                    <p class="text-xs text-gray-400 mt-0.5">Ver presentación en Canva</p>
                </div>
            </a>

            <!-- Botón WhatsApp -->
            <a href="#" class="w-full flex items-center p-4 bg-gray-800/60 hover:bg-gray-700/80 border border-gray-700 hover:border-gray-500 rounded-2xl transition-all group">
                <div class="w-12 h-12 bg-gray-900 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform text-green-400">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.3-2-1-1 .8c-1-.4-1.9-1.300-2.300-2.300l.8-1-1-2z"/></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-bold text-white">WhatsApp</p>
                    <p class="text-xs text-gray-400 mt-0.5">+52 55 1234 5678</p>
                </div>
            </a>
            
            <!-- Botón Correo -->
            <a href="mailto:info@lagarraprints.com" class="w-full flex items-center p-4 bg-gray-800/60 hover:bg-gray-700/80 border border-gray-700 hover:border-gray-500 rounded-2xl transition-all group">
                <div class="w-12 h-12 bg-gray-900 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform text-blue-400">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-bold text-white">Correo Electrónico</p>
                    <p class="text-xs text-gray-400 mt-0.5">info@lagarraprints.com</p>
                </div>
            </a>
        </div>

        <div class="mt-6 text-center fade-in-up delay-300">
            <button class="text-xs text-gray-400 hover:text-accent font-medium underline underline-offset-4 transition-colors">
                Guardar Contacto en Agenda
            </button>
        </div>
        
    </main>

    <script>
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'Angel Sotojo - La Garra Prints',
                    text: 'Aquí tienes mi tarjeta digital y portafolio.',
                    url: window.location.href,
                })
                .catch((error) => console.log('Error al compartir', error));
            } else {
                alert('Copia el enlace superior para compartir la tarjeta.');
            }
        }
    </script>
</body>
</html>
